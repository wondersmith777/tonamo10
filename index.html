   imgs:["photos/09/4.jpg","photos/09/2.jpg","photos/09/3.jpg","photos/09/1.jpg"]}
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const bg = src => src ? ` style="background-image:url('${encodeURI(src)}')"` : "";

ITEMS.forEach(it => { if (it.note) (notes[it.note] = notes[it.note] || []).push(it.name); });

const rows = list => (list || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${linkX(v)}</dd>`).join("");
const lab = (jp, en) => `<span class="jp">${jp}</span><span class="cap">${en}</span>`;   
const price = it => it.price ? `<span class="p en">¥${esc(it.price)}</span>` : `<span class="p st">${esc(it.status || "")}</span>`;
const DEMO = +new URLSearchParams(location.search).get("demo") || 0;
const imgsOf = it => DEMO ? Array(DEMO).fill("") : (it.imgs && it.imgs.length ? it.imgs : [""]);
const TPL = {
  1: [[0,0,100,100]],
  2: [[0,0,58,100],[58,0,42,100]],
  3: [[0,0,58,100],[58,0,42,56],[58,56,42,44]],
  4: [[0,0,46,100],[46,0,30,100],[76,0,24,52],[76,52,24,48]],                      
  "4w": [[0,0,40,100],[40,0,60,37],[40,37,32,63],[72,37,28,63]],                   
  5: [[0,0,44,100],[44,0,30,60],[44,60,30,40],[74,0,26,40],[74,40,26,60]],         
  6: [[0,0,44,69],[0,69,44,31],[44,0,29,60],[44,60,29,40],[73,0,27,40],[73,40,27,60]]   
};
function gallery(it, i) {
  const im = imgsOf(it), n = im.length;
  let t = it.tpl || TPL[n === 4 && it.wide ? "4w" : n];
  if (!t) {   
    const c = Math.ceil(Math.sqrt(n * 4 / 3)), r = Math.ceil(n / c);
    t = im.map((_, k) => [(k % c) * 100 / c, Math.floor(k / c) * 100 / r, 100 / c, 100 / r]);
  }
  return im.map((src, k) => {
    const [x, y, w, h] = t[k];
    const img = (src ? `;background-image:url('${encodeURI(src)}')` : "") + (it.pos && it.pos[k] ? `;background-position:${it.pos[k]}` : "");
    return `<div class="ph" data-i="${i}" data-k="${k}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%${img}">${src ? "" : (n > 1 ? k + 1 : "照片")}${k === 0 && n > 1 ? `<span class="zm">${n} PHOTOS</span>` : ""}</div>`;
  }).join("");
}
const fo = (n, side) => `<div class="fo ${side}"><span>${esc(INFO.circle)}</span><span>${pad(n)}</span></div>`;
let html = `<div class="page cover">
  <div class="ph"${bg(INFO.cover)}>${INFO.cover ? "" : "封面照片"}</div>
  <div class="mast en lit">${esc(INFO.circle)}</div>
  <div class="sub cap"><span></span><span class="lit">Tonamo 10</span></div>
  ${news.length ? `<div class="nw"><span class="cap lit">New</span>${news.map(it => `<span class="lit${/^[「『（【]/.test(it.name) ? " hang" : ""}">${esc(it.name)}</span>`).join("")}</div>` : ""}
  <div class="ttl lit">お品書き</div>
  <div class="ev"><div class="lit">${esc(INFO.event)}<br>${esc(INFO.date)}<br>${esc(INFO.place)}<br>${esc(INFO.online)}</div><div class="no en"><small class="lit">SPACE</small><span class="lit">${esc(INFO.space)}</span></div></div>
</div>
<div class="page txt info">
  <div class="cap red">Information</div>
  <h2>ご案内</h2>
  <dl>
    <dt style="margin-top:0">${lab("スペース", "Space")}</dt><dd class="big en">${esc(INFO.space)}</dd>
    <dt>${lab("イベント", "Event")}</dt><dd>${esc(INFO.event)}<br>${esc(INFO.date)}<br>${esc(INFO.place)}</dd>
    <dt>${lab("オンライン", "Online")}</dt><dd>${esc(INFO.online)}（BOOTH）</dd>
    <dt>${lab("お支払い", "Payment")}</dt><dd>${esc(INFO.pay)}</dd>
    <dt>${lab("ご購入制限", "Limit")}</dt><dd>${esc(INFO.limit)}</dd>
  </dl>
  <div class="day">${Object.entries(notes).map(([n, names]) => `<b class="red">※ ${esc(n)}</b>　${names.map(esc).join("、")}<br>`).join("")}<span class="stk">※ ${esc(INFO.stock)}</span></div>
  ${fo(2, "")}
</div>
<div class="page txt">
  <div class="cap red">Contents</div>
  <h2>目次</h2>
  <ol class="toc">${ITEMS.map((it, i) => `<li data-go="${FIRST + i}"><span class="n en">${pad(i + 1)}</span><span class="t">${esc(it.name)}${it.tag ? `<span class="g red">${esc(it.tag)}</span>` : ""}${it.note ? `<span class="g red">${esc(it.note)}</span>` : ""}</span>${price(it)}</li>`).join("")}</ol>
  ${fo(3, "r")}
</div>`;
ITEMS.forEach((it, i) => {
  html += `<div class="page it">
    <div class="gal">${gallery(it, i)}</div>
    <div class="bd">
      <div class="k"><span class="n en">${pad(i + 1)}</span></div>
      <div class="nm">${esc(it.name)}</div>
      ${it.tag ? `<div class="g red">${esc(it.tag)}</div>` : ""}${it.sub ? `<div class="g red">${esc(it.sub)}</div>` : ""}
      ${it.note ? `<div class="nt red">※ ${esc(it.note)}</div>` : ""}
    </div>
    <div class="dt">
      ${it.desc ? `<p class="ds">${linkX(it.desc).replace(/\n/g, "<br>")}</p>` : ""}
      ${(it.specs || it.credits) ? `<div class="cols"><dl>${rows(it.specs)}</dl><dl>${rows(it.credits)}</dl></div>` : ""}
      ${it.spec ? `<dl class="one"><dt>仕様</dt><dd>${esc(it.spec)}</dd></dl>` : ""}
    </div>
    ${it.cf ? `<div class="ol cf"><a href="${esc(it.cf.url)}" target="_blank" rel="noopener">${esc(it.cf.label)} →</a><small>${esc(it.cf.text).replace(/\n/g, "<br>")}</small></div>` : ""}
    ${it.online ? `<div class="ol"><a href="${esc(it.online)}" target="_blank" rel="noopener">${esc(ONLINE_LABEL)}　BOOTH →</a>${it.onlineNote ? `<small>${esc(ONLINE_NOTE)}</small>` : ""}</div>` : ""}
    ${it.price ? `<div class="pr en"><i>¥</i>${esc(it.price)}</div>` : `<div class="pr st">${esc(it.status || "")}</div>`}
    ${fo(FIRST + i + 1, i % 2 ? "r" : "")}
  </div>`;
});
html += `<div class="page txt onl">
  <div class="cap red">Online</div>
  <h2>オンライン即売会</h2>
  <p class="od">${esc(INFO.online)}（BOOTH）</p>
  <ol class="toc">${ITEMS.map((it, i) => it.online ? `<li data-go="${FIRST + i}"><span class="n en">${pad(i + 1)}</span><span class="t">${esc(it.name)}</span><a class="bl" href="${esc(it.online)}" target="_blank" rel="noopener">BOOTH →</a></li>` : "").join("")}</ol>
  <p class="on">${esc(ONLINE_NOTE)}</p>
  ${fo(FIRST + ITEMS.length + 1, "r")}
</div>`;
html += `<div class="page back">
  <div class="mast en lit">${esc(INFO.circle)}</div>
  <div class="x"><span class="cap">Space ${esc(INFO.space)}</span>X　${linkX(INFO.x)}</div>
</div>`;
const book = document.getElementById("book");
book.innerHTML = html;
const flip = new St.PageFlip(book, {
  width: 420, height: 596,          
  size: "stretch",
  minWidth: 240, maxWidth: 900, minHeight: 340, maxHeight: 1280,
  showCover: true,
  usePortrait: true,
  mobileScrollSupport: false,
  drawShadow: true,
  maxShadowOpacity: 0.55,
  flippingTime: 950,
  swipeDistance: 24
});
document.querySelectorAll(".page").forEach((p, i) => p.classList.toggle("odd", i % 2 === 1));
flip.loadFromHTML(document.querySelectorAll(".page"));
try { flip.pages.pages.forEach(p => { p.setDensity("soft"); p.setDrawingDensity("soft"); }); } catch (e) {}
const cnt = document.getElementById("cnt");
const upd = () => { cnt.textContent = (flip.getCurrentPageIndex() + 1) + " / " + flip.getPageCount(); };
flip.on("flip", upd);
flip.on("changeOrientation", upd);
document.getElementById("prev").onclick = () => flip.flipPrev();
document.getElementById("next").onclick = () => flip.flipNext();
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") flip.flipNext(); if (e.key === "ArrowLeft") flip.flipPrev(); });
document.querySelectorAll(".toc li").forEach(li => {
  ["mousedown", "touchstart"].forEach(ev => li.addEventListener(ev, e => e.stopPropagation(), {passive: true}));
  li.addEventListener("click", e => { if (!e.target.closest("a")) flip.flip(+li.dataset.go); });
});
const lb = document.createElement("div");
lb.className = "lb";
lb.innerHTML = `<div class="top"><b></b><i></i><button class="x" aria-label="閉じる">×</button></div>
<div class="st"><button class="nav p" aria-label="前の写真">‹</button><button class="nav n" aria-label="次の写真">›</button></div>
<div class="dots"></div>`;
document.body.appendChild(lb);
const lbT = lb.querySelector("b"), lbC = lb.querySelector("i"), lbS = lb.querySelector(".st"), lbD = lb.querySelector(".dots");
let lbI = 0, lbK = 0;
function lbShow() {
  const it = ITEMS[lbI], im = imgsOf(it);
  lbK = (lbK + im.length) % im.length;
  lbT.textContent = it.name;
  lbC.textContent = (lbK + 1) + " / " + im.length;
  const old = lbS.querySelector("img,.none"); if (old) old.remove();
  let el;
  if (im[lbK]) { el = new Image(); el.src = encodeURI(im[lbK]); el.alt = it.name; el.draggable = false; }
  else { el = document.createElement("div"); el.className = "none"; el.textContent = "照片 " + (lbK + 1); }
  lbS.appendChild(el);
  lb.querySelectorAll(".nav").forEach(b => b.style.display = im.length > 1 ? "" : "none");
  lbD.innerHTML = im.length > 1 ? im.map((s, k) => `<span data-k="${k}" class="${k === lbK ? "on" : ""}"${bg(s)}></span>`).join("") : "";
}
const lbOpen = (i, k) => { lbI = i; lbK = k; lb.classList.add("on"); lbShow(); };
const lbClose = () => lb.classList.remove("on");
const lbStep = d => { lbK += d; lbShow(); };
lb.querySelector(".x").onclick = lbClose;
lb.querySelector(".nav.p").onclick = e => { e.stopPropagation(); lbStep(-1); };
lb.querySelector(".nav.n").onclick = e => { e.stopPropagation(); lbStep(1); };
lbD.onclick = e => { const s = e.target.closest("span"); if (s) { lbK = +s.dataset.k; lbShow(); } };
let sx = null;
lbS.addEventListener("pointerdown", e => { sx = e.clientX; });
lbS.addEventListener("pointerup", e => {
  if (sx === null || e.target.closest(".nav")) { sx = null; return; }
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 40) lbStep(dx < 0 ? 1 : -1);   
  else lbClose();                                   
});
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  e.stopImmediatePropagation();
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowRight") lbStep(1);
  if (e.key === "ArrowLeft") lbStep(-1);
}, true);
let tap = null, guard = false;
const fc = flip.flipController;
if (fc && typeof fc.flip === "function") { const orig = fc.flip.bind(fc); fc.flip = p => { if (!guard) orig(p); }; }
book.addEventListener("pointerdown", e => {
  const ph = e.target.closest(".it .ph");
  tap = ph ? {x: e.clientX, y: e.clientY, ph} : null;
  guard = !!ph || !!e.target.closest(".page a");   
}, true);
window.addEventListener("pointerup", e => {
  const t = tap; tap = null;
  setTimeout(() => { guard = false; }, 80);
  if (!t || Math.hypot(e.clientX - t.x, e.clientY - t.y) > 8) return;
  lbOpen(+t.ph.dataset.i, +t.ph.dataset.k);
}, true);
window.addEventListener("pointercancel", () => { tap = null; guard = false; });
const fx = document.createElement("div");
fx.className = "fx";
fx.innerHTML = '<div class="sh"></div><div class="stk l"></div><div class="stk r"></div>';
const wrap = book.querySelector(".stf__wrapper") || book;
wrap.insertBefore(fx, wrap.firstChild);
const [sh, stkL, stkR] = fx.children;
let moving = false, plan = null, prevState = "read";
function layout() {
  const r = flip.getBoundsRect(), land = flip.getOrientation() === "landscape";
  book.classList.toggle("land", land);
  const i = flip.getCurrentPageIndex(), n = flip.getPageCount();
  const first = i === 0, last = i >= n - 1, pw = r.pageWidth;
  let look = !land ? "single" : first ? "front" : last ? "back" : "open";
  let late = false;          
  if (land && plan) { look = plan.look; late = plan.late; }
  const x = look === "open" || look === "back" ? r.left : r.left + pw;
  const w = look === "open" ? r.width : pw;
  sh.style.transition = late ? "left .42s linear .5s,width .42s linear .5s" : "left .42s linear,width .42s linear";
  Object.assign(sh.style, {left: x + "px", top: r.top + "px", width: w + "px", height: r.height + "px"});
  const shift = look === "front" ? -pw / 2 : look === "back" ? pw / 2 : 0;
  book.style.transform = `translateX(${shift}px)`;
  const max = Math.max(5, pw * 0.022), p = i / (n - 1);
  const L = look === "open" || look === "back" ? Math.max(1.5, max * p) : 0;
  const R = look === "open" || look === "front" || look === "single" ? Math.max(1.5, max * (1 - p)) : 0;
  const od = late ? ".3s linear .6s" : ".25s linear";
  stkL.style.transition = stkR.style.transition = "opacity " + od;
  Object.assign(stkL.style, {left: (r.left - L) + "px", top: (r.top + 1) + "px", width: L + "px", height: (r.height - 2) + "px", opacity: L ? 1 : 0});
  Object.assign(stkR.style, {left: (r.left + r.width) + "px", top: (r.top + 1) + "px", width: R + "px", height: (r.height - 2) + "px", opacity: R ? 1 : 0});
}
function makePlan() {
  if (flip.getOrientation() !== "landscape" || prevState === "user_fold") return null;
  const i = flip.getCurrentPageIndex(), n = flip.getPageCount();
  let dir = null;
  try { dir = flip.flipController.calc.getDirection(); } catch (e) {}   
  if (i === 0) return {look: "open", late: true};
  if (i >= n - 1) return {look: "open", late: true};
  if (dir === 1 && i <= 2) return {look: "front", late: false};
  if (dir === 0 && i >= n - 3) return {look: "back", late: false};
  return null;
}
flip.on("changeState", e => {
  const was = moving;
  moving = e.data === "flipping";
  if (moving && !was) plan = makePlan();
  if (!moving) plan = null;
  prevState = e.data;
  layout();
});
flip.on("flip", () => { if (!moving) layout(); });   
flip.on("changeOrientation", () => setTimeout(layout, 0));
const relayout = () => [60, 250, 700, 1500].forEach(ms => setTimeout(() => { layout(); litDone = false; tryLit(); }, ms));
window.addEventListener("resize", relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe(book);
relayout();
layout();
upd();
function litCover() {
  const cv = document.querySelector(".cover"), c = cv.getBoundingClientRect();
  if (!c.width) return false;
  cv.querySelectorAll(".lit").forEach(el => {
    const r = el.getBoundingClientRect();
    el.style.setProperty("--ox", ((r.left - c.left) / c.width * 100).toFixed(2));
    el.style.setProperty("--oy", ((r.top - c.top) / c.width * 100).toFixed(2));
  });
  return true;
}
let litDone = false;
const tryLit = () => { if (!litDone && flip.getCurrentPageIndex() === 0) litDone = litCover(); };
flip.on("flip", () => setTimeout(tryLit, 50));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { book.classList.add("on"); setTimeout(tryLit, 60); });
</script>
